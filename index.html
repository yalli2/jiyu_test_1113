const tag=(n,a)=>a.map(q=>(q.tp=n,q));
function genMeaning(n){return tag(1,sample(V,n).map((v,k)=>{const o=sample(V.filter(x=>x!==v),3);
 return k%2?{t:'mc',q:`<div class="big">${B(v.ko,v.en)}</div><p>${B('스페인어로는?','In Spanish?')}</p>`,opts:[{h:v.inf,ok:1},...o.map(x=>({h:x.inf}))],ans:v.inf,say:v.inf}
 :{t:'mc',q:`<div class="big es">${v.inf}</div><p>${B('무슨 뜻일까요?','What does it mean?')}</p>`,opts:[{h:B(v.ko,v.en),ok:1},...o.map(x=>({h:B(x.ko,x.en)}))],ans:`${v.inf} = ${B(v.ko,v.en)}`,say:v.inf};}));}
function combos(n){const all=[];V.forEach(v=>P5.forEach(i=>all.push([v,i])));return sample(all,n);}
const bootEx=(v,i)=>isBoot(i)?B(`👢 부츠 안! ${v.ch} 변화`,`👢 Inside the boot! ${v.ch}`):B('부츠 밖(nosotros) → 어간이 변하지 않아요!','Outside the boot (nosotros) → no stem change!');
const conjQ=(v,i)=>`<span class="pill">${PR[i]}</span> + <span class="es">${v.inf}</span>`;
function genConjMC(n){return tag(1,combos(n).map(([v,i])=>{const c=conj(v,i),e=END[v.inf.slice(-2)][i];
 const d=uniq([(isBoot(i)?v.s:v.c)+e,...shuffle(P5.filter(x=>x!==i)).map(x=>conj(v,x))]).filter(x=>x!==c).slice(0,3);
 return {t:'mc',q:conjQ(v,i),opts:[{h:c,ok:1},...d.map(h=>({h}))],ans:c,say:c,ex:bootEx(v,i)};}));}
function genConjType(n){return tag(1,combos(n).map(([v,i])=>{const c=conj(v,i);
 return {t:'type',q:conjQ(v,i)+`<p>${B(v.ko,v.en)}</p>`,a:[c],ans:c,say:c,ex:bootEx(v,i)};}));}
function genSent(n){return tag(1,sample(SENT,n).map(s=>({t:'type',q:s[0].replace('___',BL)+`<p><span class="pill">${s[1]}</span> ${B(s[3],s[4])}</p>`,a:[s[2]],ans:s[0].replace('___',s[2]),say:s[0].replace('___',s[2])})));}
function genAl(n){return tag(2,sample(PLACES,n).map(p=>{const S=pick(SUBJ2),c=prep(p),full=`${S.es} ${S.ir} ${c} ${p.es}.`;
 return {t:'mc',q:`${S.es} ${S.ir} ${BL} ${p.es}.<p>${B(p.ko,p.en)}</p>`,opts:[{h:'al',ok:c==='al'},{h:'a la',ok:c==='a la'},{h:'a el'},{h:'de la'}],ans:full,say:full,
  ex:p.g==='m'?B(`<b>el</b> ${p.es} (남성) → a + el = <b>al</b>`,`<b>el</b> ${p.es} (masculine) → a + el = <b>al</b>`):B(`<b>la</b> ${p.es} (여성) → <b>a la</b>`,`<b>la</b> ${p.es} (feminine) → <b>a la</b>`)};}));}
function genIr(n){return tag(2,sample(SUBJ2,n).map(S=>{const p=pick(PLACES),full=`${S.es} ${S.ir} ${prep(p)} ${p.es}.`;
 const d=sample(['voy','vas','va','vamos','van','ir'].filter(x=>x!==S.ir),3);
 return {t:'mc',q:`${S.es} ${BL} ${prep(p)} ${p.es}.`,opts:[{h:S.ir,ok:1},...d.map(h=>({h}))],ans:full,say:full};}));}
function genIrWrite(n){return tag(2,sample(PLACES,n).map(p=>{const S=pick(SUBJ),core=`${S.ir} ${prep(p)} ${p.es}`,a=[core,`${S.es} ${core}`];
 if(S.es==='Ellos')a.push('Ellas '+core);
 return {t:'type',q:`${B(`${S.ko} ${p.ko}에 가.`,`${S.en} to the ${p.en}.`)}<p>${B('스페인어 문장으로 써 보세요','Write the sentence in Spanish')} · <span class="pill">${p.g==='m'?'el':'la'} ${p.es}</span></p>`,a,ans:`${S.es} ${core}.`,say:`${S.es} ${core}.`,
  ex:p.g==='m'?'a + el = <b>al</b>':'a + la = <b>a la</b>'};}));}
function genInf(n){const pool=REG.concat(V.map(v=>[v.inf,conj(v,0),conj(v,1),conj(v,5)]));
 return tag(3,sample(pool,n).map(r=>({t:'mc',q:B('동사원형(infinitive)은 어느 것?','Which one is the infinitive?'),opts:r.map((h,k)=>({h,ok:k===0})),ans:r[0],say:r[0],ex:B(`동사원형은 <b>-${r[0].slice(-2)}</b>로 끝나요.`,`An infinitive ends in <b>-${r[0].slice(-2)}</b>.`)})));}
function genPrep(n){return tag(3,sample(PREPQ,n).map(s=>{const full=`${s[0]} ${s[2]==='∅'?'':s[2]+' '}${s[1]}`;
 return {t:'mc',q:`${s[0]} ${BL} ${s[1]}<p>${B(s[3],s[4])}</p>`,opts:['a','de','que','∅'].map(h=>({h:h==='∅'?B('∅ (아무것도 없음)','∅ (nothing)'):h,ok:h===s[2]})),ans:full,say:full};}));}
function genTwo(n){return tag(3,sample(TWO,n).map(s=>({t:'mc',q:B('올바른 문장을 고르세요','Choose the correct sentence'),opts:[{h:s[0],ok:1},...s[1].map(h=>({h}))],ans:s[0],say:s[0],ex:B('첫 번째 동사만 변화시키고, 두 번째는 원형 그대로!','Conjugate the 1st verb, leave the 2nd as an infinitive!')})));}
function genOrd(list,n,tp){return tag(tp,sample(list,n).map(s=>({t:'order',q:B(s[1],s[2])+`<p>${B('단어를 눌러 문장을 만드세요','Tap the words to build the sentence')}</p>`,words:s[0].split(' '),ans:s[0],say:s[0]})));}
function genGusta(n){const EX={s:B('단수 명사 → 단수형','Singular noun → singular verb'),p:B('복수 명사 → <b>-n</b>을 붙여요!','Plural noun → add <b>-n</b>!'),i:B('동사원형(활동)은 여러 개여도 항상 단수형!','Infinitives (activities) always take the singular — even two of them!')};
 return tag(4,sample(GQ,n).map(s=>{const f=GF[s[1]],c=f[s[2]==='p'?1:0],full=s[0].replace('___',c);
 return {t:'mc',q:s[0].replace('___',BL)+`<p>${B(s[3],s[4])}</p>`,opts:f.map(h=>({h,ok:h===c})),ans:full,say:full,ex:EX[s[2]]};}));}
function genPron(n){const a=PRON.map(s=>({t:'mc',q:s[0].replace('___',BL),opts:[{h:s[1],ok:1},...s[2].map(h=>({h}))],ans:s[0].replace('___',s[1]),say:s[0].replace('___',s[1]).replace(/\(.*?\)/,''),ex:B('me = 나에게 / te = 너에게. yo, tú는 쓰지 않아요!','me = to me / te = to you. Never yo or tú here!')}))
 .concat(QA.map(s=>({t:'mc',q:`${s[0]}<p>${B('알맞은 대답은?','Choose the best answer')}</p>`,opts:[{h:s[1],ok:1},...s[2].map(h=>({h}))],ans:s[1],say:s[0]+' '+s[1],ex:B('¿Te…? 로 물으면 me…로 대답!','Asked with ¿Te…? → answer with me…!')})));
 return tag(4,sample(a,n));}
function genFinal(){return shuffle([].concat(genMeaning(2),genConjMC(2),genConjType(2),genSent(2),genAl(2),genIr(1),genIrWrite(2),genInf(1),genPrep(3),genTwo(1),genOrd(ORD3,1,3),genGusta(3),genPron(2),genOrd(ORD4,1,4)));}

<li>${B('<b>jugar</b>는 시험범위에서 o→ue 그룹에 있지만 실제로는 <b>u→ue</b>','<b>jugar</b> is listed with the o→ue group, but it is really <b>u→ue</b>')}: juego, juegas, juega, <u>jugamos</u>, juegan</li>
<li><b>volver</b> = ${B('(사람이) 돌아오다','to come back (a person)')} / <b>devolver</b> = ${B('(물건을) 돌려주다','to give something back')}</li>

<li><b>preferir</b>, <b>dormir</b>${B('는 -ir 동사 → nosotros: prefer<b>imos</b>, dorm<b>imos</b>','are -ir verbs → nosotros: prefer<b>imos</b>, dorm<b>imos</b>')}</li></ul></div>

function vT2(){return `<h2>🚶 2. ${TOPIC[2].n}</h2>
<div class="card t"><h3>ir = ${B('가다 (불규칙!)','to go (irregular!)')}</h3>
<div class="boot">${[0,3,1,4,2,5].map(i=>`<div class="${i===4?'dim':''}" data-say="${IR[i]}"><small>${PR[i]}</small><b>${IR[i]}</b></div>`).join('')}</div></div>
<div class="card y"><h3>${B('~에 가다','To go to the [place]')}</h3>
<div class="formula">ir + <span class="es">a</span> + el/la + ${B('장소','place')}</div>
<div class="formula">a + el = <span class="es" style="font-size:1.5rem">al</span> &nbsp;|&nbsp; a + la = <span class="es" style="font-size:1.5rem">a la</span></div>
<ul><li>${B('남성 명사 (보통 -o)','Masculine noun (usually -o)')}: <span class="es">Voy al banco.</span> ${sayBtn('Voy al banco.')}</li>
<li>${B('여성 명사 (보통 -a)','Feminine noun (usually -a)')}: <span class="es">Voy a la escuela.</span> ${sayBtn('Voy a la escuela.')}</li>
<li>⚠️ ${B('-o/-a로 안 끝나는 단어는 성을 외워야 해요','Words not ending in -o/-a: memorize the gender')}: el cine, el parque, el restaurante, el hospital, el café</li></ul></div>
<div class="card"><h3>📍 ${B('장소 단어 (누르면 문장이 들려요)','Place words (tap to hear a sentence)')}</h3>
<p><span class="chip m">${B('남성 → al','masculine → al')}</span> <span class="chip f">${B('여성 → a la','feminine → a la')}</span></p>
<div class="chips">${PLACES.map(p=>`<button class="chip ${p.g}" data-say="Voy ${prep(p)} ${p.es}.">${p.es} <small>${B(p.ko,p.en)}</small></button>`).join('')}</div></div>
<div class="card p"><h3>🎮 ${B('연습 게임','Practice drills')}</h3>${qlist(2)}</div>`;}
function vT3(){return `<h2>🔗 3. ${TOPIC[3].n}</h2>
<div class="card p"><h3>① ${B('동사원형 알아보기','Recognize an infinitive')}</h3>
<p>${B('동사원형(infinitivo)은 변화시키지 않은 기본형이에요. 항상 아래 셋 중 하나로 끝나요.','An infinitive is the unconjugated form. It always ends in one of these:')}</p>
<div class="formula"><span class="es">-ar</span> hablar · <span class="es">-er</span> comer · <span class="es">-ir</span> vivir</div></div>
<div class="card y"><h3>② ${B('동사 두 개 규칙','The two-verb rule')}</h3>
<div class="formula">🚶🚶 “When two verbs go walking,<br>the first one does the talking”</div>
<p>${B('동사가 연달아 나오면 <b>첫 번째만 변화</b>시키고, <b>두 번째는 원형</b> 그대로 둬요.','When two verbs come together, <b>conjugate the 1st</b> and leave <b>the 2nd as an infinitive</b>.')}</p>
<ul><li>✅ <span class="es">Quiero comer.</span> ${sayBtn('Quiero comer.')} &nbsp; ❌ Quiero como.</li><li>✅ <span class="es">Tengo que estudiar.</span> ${sayBtn('Tengo que estudiar.')} &nbsp; ❌ Tengo que estudio.</li></ul></div>
<div class="card"><h3>③ ${B('어떤 동사에 a / de / que 가 붙을까?','Which 1st verbs take a / de / que?')}</h3>
<table><tr><th>${B('연결','Link')}</th><th>${B('표현 + 동사원형','Expression + infinitive')}</th></tr>
${EXPR.map(g=>`<tr><td><b class="es" style="font-size:1.2rem">${g.g==='∅'?B('없음','none'):g.g}</b></td><td>${g.list.map(x=>`<b>${x[0]}</b> <small>${B(x[1],x[2])}</small>`).join('<br>')}</td></tr>`).join('')}</table>
<p><small>⚠️ ${B('선생님이 나눠주신 표와 비교해서, 표에 있는 동사를 우선으로 외우세요.','Compare with the table your teacher attached and prioritize the verbs on it.')}</small></p></div>
<div class="card t"><h3>💡 ${B('암기 팁','Memory tips')}</h3><ul>
<li>${B('<b>a</b> = 앞으로 나아가는 느낌 (갈 거다·시작하다·배우다)','<b>a</b> = moving toward something (going to, start, learn)')}</li>
<li>${B('<b>de</b> = 끝나거나 떨어지는 느낌 (방금 했다·그만두다)','<b>de</b> = finishing / moving away (have just, stop)')}</li>
<li>${B('<b>que</b> = 의무 (tener que, hay que)','<b>que</b> = obligation (tener que, hay que)')}</li></ul></div>
<div class="card p"><h3>🎮 ${B('연습 게임','Practice drills')}</h3>${qlist(3)}</div>`;}
function vT4(){return `<h2>💛 4. Gustar · aburrir · interesar</h2>
<div class="card r"><h3>${B('"의견" 동사는 거꾸로 생각해요','"Opinion" verbs work backwards')}</h3>
<p>${B('<span class="es">Me gusta el chocolate</span> = "초콜릿이 <b>나에게</b> 즐거움을 준다". 그래서 동사는 <b>좋아하는 대상</b>에 맞춰요.','<span class="es">Me gusta el chocolate</span> = "Chocolate is pleasing <b>to me</b>." So the verb matches <b>the thing liked</b>, not the person.')}</p>
<table><tr><th></th><th>gustar<br><small>${B('좋아하다','to like')}</small></th><th>aburrir<br><small>${B('지루하다','to bore')}</small></th><th>interesar<br><small>${B('관심 있다','to interest')}</small></th></tr>
<tr><td>${B('단수 명사 / 동사원형','singular noun / infinitive')}</td><td><b class="es">gusta</b></td><td><b class="es">aburre</b></td><td><b class="es">interesa</b></td></tr>
<tr><td>${B('복수 명사','plural noun')}</td><td><b class="es">gustan</b></td><td><b class="es">aburren</b></td><td><b class="es">interesan</b></td></tr></table></div>
<div class="card y"><h3>me / te</h3>
<div class="formula"><span class="es">me</span> = ${B('나에게','to me')} &nbsp;·&nbsp; <span class="es">te</span> = ${B('너에게','to you')}</div>
<ul><li>— ¿<b>Te</b> gusta el fútbol? ${sayBtn('¿Te gusta el fútbol?')}</li><li>— Sí, <b>me</b> gusta. / No, no <b>me</b> gusta. ${sayBtn('Sí, me gusta. No, no me gusta.')}</li>
<li>⚠️ ${B('부정은 <b>no</b>가 me/te 앞에','Negative: <b>no</b> goes before me/te')}: <span class="es">No me gustan los lunes.</span></li><li>❌ Yo gusto · ❌ Tú gustas</li></ul></div>
<div class="card t"><h3>${B('세 가지 패턴','Three patterns')}</h3><ul>
<li>${B('단수 명사','Singular noun')}: <span class="es">Me gusta <b>la</b> música.</span> ${sayBtn('Me gusta la música.')}</li>
<li>${B('복수 명사','Plural noun')}: <span class="es">Me gusta<b>n</b> <b>los</b> perros.</span> ${sayBtn('Me gustan los perros.')}</li>
<li>${B('활동(동사원형)','Activity (infinitive)')}: <span class="es">Me gusta bailar y cantar.</span> ${sayBtn('Me gusta bailar y cantar.')} — ${B('동사원형은 여러 개여도 항상 <b>gusta</b>!','always <b>gusta</b>, even with two infinitives!')}</li>
<li>${B('명사 앞에는 el/la/los/las를 꼭 붙여요.','Always use el/la/los/las before the noun.')}</li>
<li><span class="es">Me aburre la clase.</span> = ${B('수업이 지루해.','The class bores me.')} · <span class="es">Me interesan los deportes.</span> = ${B('스포츠에 관심 있어.','Sports interest me.')}</li></ul></div>
<div class="card p"><h3>🎮 ${B('연습 게임','Practice drills')}</h3>${qlist(4)}</div>`;}
function vFinal(){return `<h2>🏆 ${B('실전 모의고사','Mock exam')}</h2>
<div class="card y"><p>${B('4개 주제에서 골고루 25문제가 나와요. 매번 문제가 바뀌니 여러 번 도전해 보세요!','25 questions mixed from all 4 topics. The questions change every time — try it more than once!')}</p>${qbtn('final')}</div>
<div class="card"><h3>📊 ${B('주제별 달성도','Progress by topic')}</h3>${[1,2,3,4].map(t=>`<p style="margin:10px 0 0">${TOPIC[t].e} ${TOPIC[t].n} — <b>${topicPct(t)}%</b></p><div class="meter"><i style="width:${topicPct(t)}%"></i></div>`).join('')}
<button class="mini" style="margin-top:14px" onclick="resetAll()">${B('기록 초기화','Reset progress')}</button></div>
<div class="card t"><h3>✅ ${B('시험 직전 체크리스트','Last-minute checklist')}</h3><ul>
<li>${B('동사 10개의 뜻과 5개 인칭 변화를 쓸 수 있다','I can write meanings and forms of all 10 verbs')}</li>
<li>${B('voy, vas, va, vamos, van + al / a la','voy, vas, va, vamos, van + al / a la')}</li>
<li>${B('a / de / que 가 붙는 동사를 구분할 수 있다','I know which verbs take a / de / que')}</li>
<li>${B('me/te + gusta(n), aburre(n), interesa(n)','me/te + gusta(n), aburre(n), interesa(n)')}</li></ul><p class="big" style="font-size:1.4rem">¡Buena suerte! 🍀</p></div>`;}
const VIEW={home:vHome,t1:vT1,t2:vT2,t3:vT3,t4:vT4,final:vFinal};
const NAV=[['home','🏠','Inicio'],['t1','👢','1'],['t2','🚶','2'],['t3','🔗','3'],['t4','💛','4'],['final','🏆','Final']];
function render(){$('#main').innerHTML=VIEW[cur]();$('#nav').innerHTML=NAV.map(n=>`<button class="${cur===n[0]?'on':''}" onclick="go('${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`).join('');}
function go(id){cur=id;render();window.scrollTo(0,0);}
function toggleLang(){const en=document.body.classList.toggle('en');document.body.classList.toggle('ko',!en);save.lang=en?'en':'ko';store.set(save);}
function resetAll(){save.best={};store.set(save);render();}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';const v=speechSynthesis.getVoices().find(v=>/^es/i.test(v.lang));if(v){u.voice=v;u.lang=v.lang;}u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

/* ============ quiz engine ============ */
let QZ=null;
function startQuiz(key){QZ={key,qs:QUIZ[key].gen(),i:0,ok:0,streak:0,wrong:[],tp:{}};$('#quiz').hidden=false;document.body.style.overflow='hidden';renderQ();}
function closeQuiz(){$('#quiz').hidden=true;document.body.style.overflow='';QZ=null;render();}
function renderQ(){const z=QZ,q=z.qs[z.i];z.done=false;let body='';
 if(q.t==='mc'){q._o=shuffle(q.opts);body=`<div class="opts">${q._o.map((o,k)=>`<button class="opt" onclick="ansMC(${k})">${o.h}</button>`).join('')}</div>`;}
 else if(q.t==='type'){body=`<input id="ti" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')ansType()"><div class="acc">${'áéíóúñ'.split('').map(c=>`<button onclick="addCh('${c}')">${c}</button>`).join('')}</div><button class="primary" id="chk" onclick="ansType()">${B('확인','Check')}</button>`;}
 else{let p=shuffle(q.words),n=0;while(p.join(' ')===q.words.join(' ')&&n++<10)p=shuffle(q.words);q._pool=p;q._sel=[];body=`<div id="ansline" class="ansline"></div><div id="pool" class="pool"></div><button class="primary" id="chk" onclick="ansOrder()">${B('확인','Check')}</button>`;}
 $('#quiz').innerHTML=`<div class="qwrap"><div class="qtop"><button class="x" onclick="closeQuiz()">✕</button><div class="bar"><i style="width:${z.i/z.qs.length*100}%"></i></div><span>${z.i+1}/${z.qs.length}</span><span>🔥${z.streak}</span></div><div class="card"><div class="qtext">${q.q}</div>${body}<div id="fb"></div></div></div>`;
 $('#quiz').scrollTop=0;
 if(q.t==='order')drawOrder();if(q.t==='type')$('#ti').focus();}
function addCh(c){const t=$('#ti');if(!t||QZ.done)return;t.value+=c;t.focus();}
function drawOrder(){const q=QZ.qs[QZ.i];
 $('#ansline').innerHTML=q._sel.map((k,j)=>`<button class="chip on" onclick="ordRm(${j})">${q._pool[k]}</button>`).join('')||`<span class="ph">${B('아래 단어를 순서대로 눌러요','Tap the words below in order')}</span>`;
 $('#pool').innerHTML=q._pool.map((w,k)=>`<button class="chip" ${q._sel.includes(k)?'disabled':''} onclick="ordAdd(${k})">${w}</button>`).join('');}
function ordAdd(k){if(QZ.done)return;QZ.qs[QZ.i]._sel.push(k);drawOrder();}
function ordRm(j){if(QZ.done)return;QZ.qs[QZ.i]._sel.splice(j,1);drawOrder();}
function ansMC(k){const z=QZ,q=z.qs[z.i];if(z.done)return;
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q._o[j].ok)b.classList.add('ok');else if(j===k)b.classList.add('bad');});feedback(!!q._o[k].ok);}
function ansType(){const z=QZ,q=z.qs[z.i];if(z.done)return nextQ();const v=norm($('#ti').value);if(!v)return;
 const ok=q.a.some(a=>norm(a)===v),soft=!ok&&q.a.some(a=>noAcc(norm(a))===noAcc(v));$('#ti').disabled=true;
 feedback(ok||soft,soft?`<div>⚠️ ${B('악센트 표시에 주의!','Watch the accent marks!')} → <b class="es">${q.ans}</b></div>`:'');}
function ansOrder(){const z=QZ,q=z.qs[z.i];if(z.done||!q._sel.length)return;feedback(norm(q._sel.map(k=>q._pool[k]).join(' '))===norm(q.ans));}
function feedback(ok,note){const z=QZ,q=z.qs[z.i];z.done=true;
 if(ok){z.ok++;z.streak++;}else{z.streak=0;z.wrong.push(q);}
 if(q.tp){z.tp[q.tp]=z.tp[q.tp]||[0,0];z.tp[q.tp][1]++;if(ok)z.tp[q.tp][0]++;}
 const c=$('#chk');if(c)c.style.display='none';
 $('#fb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><b>${ok?pick(['¡Muy bien! 🎉','¡Perfecto! ⭐','¡Excelente! 💪','¡Genial! 🔥']):'¡Casi! 😅'}</b> ${q.say?sayBtn(q.say):''}${ok?'':`<div>${B('정답','Answer')}: <b class="es">${q.ans}</b></div>`}${note||''}${q.ex?`<div class="ex">${q.ex}</div>`:''}</div><button class="primary" onclick="nextQ()">${z.i+1<z.qs.length?B('다음 →','Next →'):B('결과 보기','See results')}</button>`;}
function nextQ(){const z=QZ;if(!z||!z.done)return;if(++z.i<z.qs.length)return renderQ();
 const pct=Math.round(z.ok/z.qs.length*100);save.best[z.key]=Math.max(save.best[z.key]||0,pct);store.set(save);if(pct>=80)confetti();
 const msg=pct>=90?B('완벽해요! 시험 준비 끝! 🎓','Amazing! You are ready! 🎓'):pct>=70?B('잘했어요! 틀린 것만 다시 보면 돼요.','Nice! Just review the ones you missed.'):B('괜찮아요! 설명을 다시 읽고 한 번 더 도전!','No worries! Re-read the lesson and try again!');
 const br=z.key==='final'?`<div class="card" style="text-align:left"><h3>📊 ${B('주제별 결과','By topic')}</h3>${[1,2,3,4].map(t=>{const r=z.tp[t]||[0,0];return `<p style="margin:8px 0 0">${TOPIC[t].e} ${TOPIC[t].n} — <b>${r[0]}/${r[1]}</b></p><div class="meter"><i style="width:${r[1]?r[0]/r[1]*100:0}%"></i></div>`;}).join('')}</div>`:'';
 $('#quiz').innerHTML=`<div class="qwrap"><div class="card result"><div>${QUIZ[z.key].title}</div><div class="pct">${pct}%</div><div style="font-size:1.8rem">${stars(pct)}</div><p><b>${z.ok} / ${z.qs.length}</b></p><p>${msg}</p></div>${br}
 ${z.wrong.length?`<div class="card"><h3>📝 ${B('틀린 문제 복습','Review your mistakes')}</h3>${z.wrong.map(q=>`<div class="rev">✅ <b class="es">${q.ans}</b> ${q.say?sayBtn(q.say):''}${q.ex?`<div class="ex">${q.ex}</div>`:''}</div>`).join('')}</div>`:''}
 <button class="primary" onclick="startQuiz('${z.key}')">🔁 ${B('다시 도전','Try again')}</button><button class="primary" style="background:#fff;color:var(--ink)" onclick="closeQuiz()">${B('돌아가기','Back')}</button></div>`;
 $('#quiz').scrollTop=0;}

/* ============ confetti ============ */
function confetti(){const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const col=['#E4432B','#FFC531','#159A8C','#6B4EE6','#FF8FA3'],ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,w:6+Math.random()*6,c:pick(col),r:Math.random()*6,d:Math.random()*2-1}));
 let n=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;p.x+=p.d;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.w/2,p.w,p.w*.6);x.restore();});if(n++<150)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();}

/* ============ init ============ */
if(typeof document!=='undefined'){
 if(save.lang==='en'){document.body.classList.replace('ko','en');}
 document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)speak(b.dataset.say);});
 const t=new Date(),d=Math.ceil((new Date(2026,10,13)-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/864e5);
 $('#dday').textContent=d>0?'D-'+d:d===0?'D-DAY':'¡Suerte!';
 try{speechSynthesis.getVoices();}catch(e){}
 render();
}
